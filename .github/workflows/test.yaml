name: Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  terraform-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
        name: Checkout source code

      - uses: hashicorp/setup-terraform@v3
        name: Setup Terraform
        with:
          # mock_provider requires Terraform >= 1.7. The module itself still supports
          # >= 1.3: test files are not consumed by module users.
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Show version
        run: terraform version

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Run tests
        run: terraform test
